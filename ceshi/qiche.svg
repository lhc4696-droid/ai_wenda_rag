
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="560"
     viewBox="0 0 900 560"
     role="img"
     aria-label="一只可爱的鹈鹕正在骑自行车">

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80D9FF"/>
      <stop offset="100%" stop-color="#E8FAFF"/>
    </linearGradient>

    <!-- 鹈鹕羽毛 -->
    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE9F1"/>
    </linearGradient>

    <!-- 嘴巴渐变 -->
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD66D"/>
      <stop offset="100%" stop-color="#F39A33"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="560" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="760" cy="95" r="46" fill="#FFE582"/>
  <circle cx="760" cy="95" r="57"
          fill="none" stroke="#FFE582"
          stroke-width="3" opacity="0.45"/>

  <!-- 云朵 -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="140" cy="110" rx="70" ry="23"/>
    <circle cx="115" cy="92" r="30"/>
    <circle cx="158" cy="85" r="38"/>

    <ellipse cx="650" cy="165" rx="48" ry="17"/>
    <circle cx="635" cy="153" r="22"/>
    <circle cx="666" cy="149" r="26"/>
  </g>

  <!-- 远处的山 -->
  <path d="M0 415 Q120 330 265 405
           Q400 345 550 405
           Q740 320 900 400
           L900 560 L0 560Z"
        fill="#BDEAC3"/>

  <!-- 草地 -->
  <path d="M0 453 Q220 438 450 455
           Q680 438 900 451
           L900 560 L0 560Z"
        fill="#8CD69B"/>

  <!-- 小路 -->
  <path d="M0 485 Q450 470 900 485
           L900 560 L0 560Z"
        fill="#F1D7AE"/>

  <!-- 自行车阴影 -->
  <ellipse cx="452" cy="519" rx="325" ry="14"
           fill="#A98C70" opacity="0.18"/>

  <!-- 自行车后轮 -->
  <g stroke-linecap="round">
    <circle cx="255" cy="425" r="88"
            fill="#F8FFFF" fill-opacity="0.38"
            stroke="#303D51" stroke-width="12"/>
    <circle cx="255" cy="425" r="78"
            fill="none" stroke="#7D95A5"
            stroke-width="2"/>

    <g stroke="#9CB1BE" stroke-width="2">
      <path d="M255 337V513 M167 425H343"/>
      <path d="M193 363L317 487
               M193 487L317 363"/>
      <path d="M221 344L289 506
               M174 391L336 459
               M174 459L336 391
               M221 506L289 344"/>
    </g>
    <circle cx="255" cy="425" r="12"
            fill="#52677D"/>
  </g>

  <!-- 自行车前轮 -->
  <g stroke-linecap="round">
    <circle cx="650" cy="425" r="88"
            fill="#F8FFFF" fill-opacity="0.38"
            stroke="#303D51" stroke-width="12"/>
    <circle cx="650" cy="425" r="78"
            fill="none" stroke="#7D95A5"
            stroke-width="2"/>

    <g stroke="#9CB1BE" stroke-width="2">
      <path d="M650 337V513 M562 425H738"/>
      <path d="M588 363L712 487
               M588 487L712 363"/>
      <path d="M616 344L684 506
               M569 391L731 459
               M569 459L731 391
               M616 506L684 344"/>
    </g>
    <circle cx="650" cy="425" r="12"
            fill="#52677D"/>
  </g>

  <!-- 自行车车架 -->
  <g fill="none" stroke="#F16F62"
     stroke-width="13" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M255 425 L375 315 L430 425 Z"/>
    <path d="M375 315 L555 315 L430 425"/>
  </g>

  <!-- 前叉 -->
  <path d="M555 315 L650 425"
        fill="none" stroke="#465C79"
        stroke-width="13" stroke-linecap="round"/>

  <!-- 座杆 -->
  <path d="M375 315 L374 292"
        stroke="#465C79" stroke-width="11"
        stroke-linecap="round"/>

  <!-- 车座 -->
  <path d="M334 291 Q374 280 412 291
           Q405 305 348 302Z"
        fill="#344258"/>

  <!-- 车把 -->
  <path d="M555 315 L551 278 L603 278
           Q618 278 619 293"
        fill="none" stroke="#465C79"
        stroke-width="11" stroke-linecap="round"/>

  <!-- 车把握柄 -->
  <path d="M600 278H622"
        stroke="#27364A" stroke-width="13"
        stroke-linecap="round"/>

  <!-- 链轮 -->
  <circle cx="430" cy="425" r="26"
          fill="#DEEAF0" stroke="#465C79"
          stroke-width="8"/>
  <circle cx="430" cy="425" r="9"
          fill="#465C79"/>

  <!-- 脚踏曲柄 -->
  <path d="M430 425 L467 452
           M430 425 L395 399"
        stroke="#344258" stroke-width="8"
        stroke-linecap="round"/>

  <path d="M452 452H485 M380 399H410"
        stroke="#344258" stroke-width="10"
        stroke-linecap="round"/>

  <!-- 鹈鹕双腿 -->
  <g fill="none" stroke="#E99447"
     stroke-width="14" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M370 305 Q374 344 405 370
             L395 399"/>
    <path d="M410 309 Q434 356 421 388
             L467 452"/>
  </g>

  <!-- 鹈鹕脚掌 -->
  <g fill="#F5AB57" stroke="#D8843D"
     stroke-width="3" stroke-linejoin="round">
    <path d="M381 392 L407 392
             L418 404 Q418 413 407 412
             L383 410Z"/>
    <path d="M452 445 L475 445
             L489 455 Q490 466 476 465
             L451 462Z"/>
  </g>

  <!-- 尾部羽毛 -->
  <path d="M316 258
           Q267 240 269 265
           Q281 273 305 278
           Q266 280 281 297
           Q305 300 330 287Z"
        fill="#DCE8EF"
        stroke="#B8CCD8" stroke-width="3"/>

  <!-- 鹈鹕身体 -->
  <ellipse cx="392" cy="265" rx="107" ry="66"
           fill="url(#feathers)"
           stroke="#C4D7E2" stroke-width="3"/>

  <!-- 鹈鹕长脖子 -->
  <path d="M449 289
           C473 249 462 223 477 189
           C482 174 482 153 493 137
           C512 123 539 137 542 160
           C526 178 511 169 506 167
           C520 211 536 259 504 300
           Q474 314 449 289Z"
        fill="url(#feathers)"
        stroke="#C4D7E2" stroke-width="3"/>

  <!-- 头部 -->
  <ellipse cx="518" cy="146" rx="45" ry="42"
           fill="#FFFFFF"
           stroke="#C4D7E2" stroke-width="3"/>

  <!-- 头顶羽毛 -->
  <path d="M484 122
           Q473 105 485 101
           Q496 108 498 117
           Q496 96 509 98
           L516 112
           Q521 97 532 108
           L532 124Z"
        fill="#FFFFFF"
        stroke="#C4D7E2" stroke-width="2"/>

  <!-- 鹈鹕的喉囊 -->
  <path d="M546 174
           Q600 185 720 188
           Q703 218 656 241
           Q585 271 547 198Z"
        fill="#F7B55F"
        stroke="#E99A3B" stroke-width="3"/>

  <!-- 长嘴上半部 -->
  <path d="M541 157
           Q616 162 724 183
           Q736 189 720 193
           Q628 189 546 180Z"
        fill="url(#beak)"
        stroke="#D98936" stroke-width="3"/>

  <!-- 喉囊上的弧线 -->
  <path d="M562 204 Q625 251 691 215"
        fill="none" stroke="#E99A3B"
        stroke-width="3" opacity="0.6"/>

  <!-- 眼睛 -->
  <ellipse cx="529" cy="139" rx="8" ry="10"
           fill="#27364A"/>
  <circle cx="532" cy="135" r="3"
          fill="#FFFFFF"/>

  <!-- 微笑般的眼部表情 -->
  <path d="M517 126 Q527 120 537 126"
        fill="none" stroke="#8297A6"
        stroke-width="2" stroke-linecap="round"/>

  <!-- 翅膀 -->
  <path d="M347 248
           Q400 218 448 258
           Q484 270 527 274
           Q552 275 583 278
           Q588 293 570 297
           Q511 308 450 298
           Q411 323 370 294
           Q349 282 347 248Z"
        fill="#EDF5F9"
        stroke="#B9CDD9" stroke-width="3"/>

  <!-- 翅膀羽毛纹理 -->
  <g fill="none" stroke="#C4D7E2"
     stroke-width="3" stroke-linecap="round">
    <path d="M378 258 Q410 288 450 287"/>
    <path d="M363 269 Q398 305 443 294"/>
    <path d="M400 249 Q440 274 477 281"/>
  </g>

  <!-- 翅膀握在车把上的末端 -->
  <ellipse cx="595" cy="282" rx="23" ry="11"
           fill="#FFFFFF"
           stroke="#B9CDD9" stroke-width="2"/>

  <!-- 草地小装饰 -->
  <g stroke="#4CAE70" stroke-width="4"
     stroke-linecap="round" fill="none">
    <path d="M95 488l-8 -11 M95 488l8 -12"/>
    <path d="M795 492l-8 -11 M795 492l8 -12"/>
    <path d="M840 474l-7 -9 M840 474l8 -10"/>
  </g>

  <!-- 运动感线条 -->
  <g stroke="#FFFFFF" stroke-width="5"
     stroke-linecap="round" opacity="0.75">
    <path d="M86 337H145"/>
    <path d="M65 360H126"/>
    <path d="M103 383H147"/>
  </g>

</svg>
