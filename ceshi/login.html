<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: url("qiche.svg") center / cover no-repeat;
    }

    .login-box {
      width: 360px;
      padding: 40px 36px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #333;
      font-size: 26px;
    }

    .login-box .subtitle {
      text-align: center;
      margin-bottom: 28px;
      color: #999;
      font-size: 14px;
    }

    .form-item {
      margin-bottom: 18px;
    }

    .form-item label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
    }

    .form-item input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-item input:focus {
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .tip {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>欢迎登录</h2>
    <p class="subtitle">请输入账号和密码</p>
    <form id="loginForm">
      <div class="form-item">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" required>
      </div>
      <div class="form-item">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn">登 录</button>
    </form>
    <p class="tip">没有账号？请联系管理员</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username) {
        alert('请输入账号');
        return;
      }
      if (!password) {
        alert('请输入密码');
        return;
      }

      // 这里仅为演示，实际项目中应调用后端接口进行校验
      alert('登录成功（演示）');
    });
  </script>
</body>
</html>
